[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qqmemory"
version = "0.5.5"
description = "Local QQ Zone archival core"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "Pillow>=12,<13",
    "requests>=2.32,<3",
    "json5>=0.12,<1",
    "beautifulsoup4>=4.12,<5",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://qqmemory.com/"
Repository = "https://github.com/FFantta/qqmemory"
Issues = "https://github.com/FFantta/qqmemory/issues"

[project.scripts]
qqmemory = "qqmemory.cli:main"

[tool.setuptools.packages.find]
include = ["qqmemory*"]

[project.optional-dependencies]
desktop = ["Flask>=3,<4", "pywebview>=6,<7"]
build = ["pyinstaller>=6,<7"]

[tool.setuptools.package-data]
qqmemory = [
    "ui/*.html",
    "ui/*.css",
    "ui/*.js",
    "cloud_ui/*.html",
    "cloud_ui/*.css",
    "cloud_ui/*.js",
    "templates/*.html",
    "templates/*.js",
]
