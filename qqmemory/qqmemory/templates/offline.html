<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>空间记忆 · 离线档案</title>
    <style>
      body {
        max-width: 820px;
        margin: 40px auto;
        padding: 24px;
        font-family: system-ui;
        background: #f7f5fa;
        color: #44364f;
      }
      article {
        padding: 28px;
        margin: 22px 0;
        background: white;
        border-radius: 18px;
        border: 1px solid #eee7f3;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .avatar {
        flex-shrink: 0;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        background: #e9dff3;
        border-radius: 50%;
        color: #9875b4;
      }
      time {
        display: block;
        color: #ac9cbb;
        font-size: 11px;
        margin-top: 6px;
      }
      .likes,
      .comment {
        background: #faf8fc;
        font-size: 12px;
        padding: 10px;
        margin-top: 8px;
        color: #9881b0;
      }
      p {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .photos {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photos > a,
      .photos > span {
        aspect-ratio: 1;
        display: block;
        overflow: hidden;
        border-radius: 10px;
        background: #f3eff8;
      }
      .photos > span {
        display: grid;
        place-items: center;
        font-size: 12px;
        color: #ad9dbf;
      }
      .qq-emoji {
        width: 1.45em;
        height: 1.45em;
        vertical-align: -0.28em;
        object-fit: contain;
        display: inline-block;
      }
      .emoji-missing {
        color: #a897b9;
      }
      input {
        padding: 12px;
        width: 80%;
      }
      .person {
        position: relative;
        cursor: help;
      }
      .person:after {
        content: attr(title);
        display: none;
        position: absolute;
        bottom: calc(100% + 5px);
        left: 0;
        white-space: nowrap;
        background: #fffdf6;
        color: #4d5548;
        border: 1px solid #dedfd4;
        border-radius: 4px;
        padding: 3px 7px;
        font:
          11px ui-monospace,
          monospace;
        box-shadow: 0 2px 8px #0001;
        z-index: 5;
      }
      .person:hover:after,
      .person:focus:after {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>空间记忆 · 离线年鉴</h1>
    <p>按时间从新到旧 · ≈ 表示以最早互动时间代替缺失的发布时间。照片点击查看原始文件。</p>
    <select id="category">
      <option value="">全部回忆</option>
      <option value="posts">我的说说</option>
      <option value="interactions">与他人互动</option>
      <option value="gifts">礼物与游戏</option>
      <option value="blogs">我的日志</option></select
    ><input id="search" placeholder="搜索正文与评论" /><!-- ARCHIVE_CARDS -->
    <script>
      function filter() {
        const q = document.getElementById("search").value,
          c = document.getElementById("category").value;
        for (const a of document.querySelectorAll("article"))
          a.hidden = !(a.textContent.includes(q) && (!c || a.dataset.category === c));
      }
      document.getElementById("search").oninput = filter;
      document.getElementById("category").onchange = filter;
    </script>
  </body>
</html>
