services:
  - type: web
    name: qqmemory-cloud
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r qqmemory/requirements-cloud.txt
    startCommand: gunicorn --chdir qqmemory --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT run_cloud:app
    healthCheckPath: /healthz
    disk:
      name: qqmemory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: QQMEMORY_CLOUD_SECRET
        generateValue: true
      - key: QQMEMORY_CLOUD_ROOT
        value: /var/data/qqmemory-cloud
      - key: QQMEMORY_CLOUD_PERSISTENT
        value: '1'
      - key: QQMEMORY_CLOUD_DISK_MOUNT
        value: /var/data
      - key: QQMEMORY_CLOUD_PROXY
        value: '1'
