name: Code readability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r qqmemory/requirements-dev.txt
      - run: python scripts/format-code.py --check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:format:web
